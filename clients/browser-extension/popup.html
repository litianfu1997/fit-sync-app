<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>FitSync 会话助手</title>
  </head>
  <body>
    <header>
      <img src="icon-128.png" alt="" width="28" height="28" />
      <div>
        <h1>FitSync 会话助手</h1>
        <p>把已登录的网页会话交给你的 FitSync 云服务</p>
      </div>
    </header>

    <main>
      <section class="notice">
        <strong>只在你点击时读取一次</strong>
        <p>
          扩展不会保存平台 Cookie，也不会后台采集浏览记录。会话会加密保存在你指定的
          FitSync 云服务，仅用于平台同步。
        </p>
      </section>

      <label for="service">FitSync 云服务地址</label>
      <input id="service" type="url" placeholder="https://你的域名/api" autocomplete="off" />
      <p class="hint">
        从 FitSync 网页发起时无需填写；直接使用扩展时需要设置，并确保服务端
        CORS 允许扩展来源。
      </p>

      <label for="token">FitSync 登录令牌</label>
      <input id="token" type="password" placeholder="从已在 FitSync 登录的网页获取" autocomplete="off" />
      <p class="hint">只保存在本扩展存储中，不发送到 FitSync 以外的域名。</p>

      <label for="platform">运动平台</label>
      <select id="platform"></select>
      <a id="login-link" class="link" href="#" target="_blank" rel="noreferrer">打开平台登录</a>

      <button id="connect" class="primary">弹窗登录并连接</button>
      <div class="actions">
        <button id="save" class="secondary">仅保存设置</button>
        <button id="logout" class="text">清除令牌</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
