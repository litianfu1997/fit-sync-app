<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitSync" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/static/logo.png" type="image/png" sizes="192x192" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180" />
    <title>FitSync · 让每一次骑行都有迹可循</title>
    <style>
      html, body { margin: 0; background: #f1f3f5; }
      .boot-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #0f141a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .boot-logo { width: 56px; height: 56px; }
      .boot-name { font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
      .boot-spinner { width: 22px; height: 22px; border: 2px solid #d5dbe1; border-top-color: #f26b21; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      .boot-text { font-size: 13px; color: #5a6673; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0a0e13; }
        .boot-splash { color: #e8ecf1; }
        .boot-spinner { border-color: #2a333d; border-top-color: #ff8a3d; }
        .boot-text { color: #97a3b1; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"
      ><div class="boot-splash"
        ><img class="boot-logo" src="/static/logo.svg" alt="" />
        <div class="boot-name">FitSync</div>
        <div class="boot-spinner" role="status" aria-label="正在加载"></div>
        <div class="boot-text">正在加载 FitSync…</div></div
      ></div
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
