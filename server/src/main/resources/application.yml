spring:
  application:
    name: fitsync-cloud
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:server/.env[.properties]
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    hikari:
      maximum-pool-size: 8
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
fitsync:
  storage-dir: ${FITSYNC_STORAGE_DIR:./.data/fits}
  encryption-key: ${FITSYNC_ENCRYPTION_KEY:}
  # 本地开发默认放行 uni-app H5 开发端口（与 clients/uniapp/vite.config.ts 的 server.port 保持一致）。
  # 浏览器直连代理后的 /api 会带上页面自身的 Origin，未列入白名单会被 CorsFilter 直接 403。
  cors-origins: ${FITSYNC_CORS_ORIGINS:http://localhost:5273,http://127.0.0.1:5273,http://localhost:5173,http://127.0.0.1:5173}
  wechat-app-id: ${WECHAT_APP_ID:}
  wechat-app-secret: ${WECHAT_APP_SECRET:}
  native-ad-unit-id: ${WECHAT_NATIVE_AD_UNIT_ID:}
  rewarded-ad-unit-id: ${WECHAT_REWARDED_AD_UNIT_ID:}
  scheduler-enabled: ${FITSYNC_SCHEDULER_ENABLED:true}
  session-days: 30
  sync-interval-ms: 900000
  strava:
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    redirect-uri: ${STRAVA_REDIRECT_URI:}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
