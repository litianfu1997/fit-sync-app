name: 手动构建 Cloud AAB（Google Play）
run-name: 构建 Cloud AAB · ${{ inputs.version_name || '默认版本' }} · 构建 ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号（例如 0.1.0）'
        required: false
        type: string
      cloud_web_url:
        description: '线上 H5 地址（必须 https://，留空则读取仓库 Variable FITSYNC_CLOUD_WEB_URL）'
        required: false
        type: string
      admob_enabled:
        description: '是否开启 Google AdMob 广告（默认关闭）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-cloud-aab-release
  cancel-in-progress: false

jobs:
  build-aab:
    name: 测试并构建签名 Cloud AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FITSYNC_USE_MAVEN_MIRRORS: 'false'
    defaults:
      run:
        shell: bash

    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 校验参数与签名 Secrets
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_CLOUD_WEB_URL: ${{ inputs.cloud_web_url }}
          VAR_CLOUD_WEB_URL: ${{ vars.FITSYNC_CLOUD_WEB_URL }}
          FITSYNC_KEYSTORE_BASE64: ${{ secrets.FITSYNC_KEYSTORE_BASE64 }}
          FITSYNC_KEYSTORE_PASSWORD: ${{ secrets.FITSYNC_KEYSTORE_PASSWORD }}
          FITSYNC_KEY_ALIAS: ${{ secrets.FITSYNC_KEY_ALIAS }}
          FITSYNC_KEY_PASSWORD: ${{ secrets.FITSYNC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          web_url="${INPUT_CLOUD_WEB_URL:-$VAR_CLOUD_WEB_URL}"
          if [[ -z "$web_url" || ! "$web_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::请通过输入参数或仓库 Variable FITSYNC_CLOUD_WEB_URL 提供有效的 https:// H5 地址。"
            exit 1
          fi
          printf 'FITSYNC_CLOUD_WEB_URL=%s\n' "$web_url" >> "$GITHUB_ENV"
          if [[ -n "$INPUT_VERSION_NAME" ]]; then
            if [[ ! "$INPUT_VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "::error::版本号格式无效。"
              exit 1
            fi
            printf 'FITSYNC_CLOUD_VERSION_NAME=%s\n' "$INPUT_VERSION_NAME" >> "$GITHUB_ENV"
          fi
          for secret_name in FITSYNC_KEYSTORE_BASE64 FITSYNC_KEYSTORE_PASSWORD FITSYNC_KEY_ALIAS FITSYNC_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::缺少仓库 Secret：$secret_name。"
              exit 1
            fi
          done
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          printf 'FITSYNC_CLOUD_VERSION_CODE=%s\n' "$version_code" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$RUNNER_TEMP/fitsync-signing"
          printf '%s' "$FITSYNC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitsync-signing/release.jks"
          test -s "$RUNNER_TEMP/fitsync-signing/release.jks"
          printf 'FITSYNC_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/fitsync-signing/release.jks" >> "$GITHUB_ENV"

      - name: 配置 JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 校验 Gradle Wrapper 并缓存依赖
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          chmod +x gradlew

      - name: 运行单元测试并构建 Cloud Release AAB
        env:
          FITSYNC_KEYSTORE_PASSWORD: ${{ secrets.FITSYNC_KEYSTORE_PASSWORD }}
          FITSYNC_KEY_ALIAS: ${{ secrets.FITSYNC_KEY_ALIAS }}
          FITSYNC_KEY_PASSWORD: ${{ secrets.FITSYNC_KEY_PASSWORD }}
          FITSYNC_CLOUD_API_BASE_URL: ${{ vars.FITSYNC_CLOUD_API_BASE_URL }}
          FITSYNC_CLOUD_APPLICATION_ID: ${{ vars.FITSYNC_CLOUD_APPLICATION_ID }}
          FITSYNC_ADMOB_ENABLED: ${{ inputs.admob_enabled }}
          FITSYNC_ADMOB_APP_ID: ${{ vars.FITSYNC_ADMOB_APP_ID }}
          FITSYNC_ADMOB_BANNER_UNIT_ID: ${{ vars.FITSYNC_ADMOB_BANNER_UNIT_ID }}
        run: ./gradlew :app:testCloudReleaseUnitTest :app:bundleCloudRelease --no-daemon --no-configuration-cache --stacktrace

      - name: 校验 AAB 签名并归档产物
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/cloudRelease/app-cloud-release.aab"
          test -s "$aab"
          jarsigner -verify -strict "$aab"
          mkdir -p dist
          cp "$aab" "dist/FitSyncCloud-build.${GITHUB_RUN_NUMBER}.aab"
          sha256sum "dist/FitSyncCloud-build.${GITHUB_RUN_NUMBER}.aab" > dist/SHA256SUMS

      - name: 上传 AAB 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fitsync-cloud-aab
          path: dist/

      - name: 清理临时签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/fitsync-signing/release.jks"
